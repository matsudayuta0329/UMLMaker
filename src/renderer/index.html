<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UML Maker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="header-left">
      <div class="brand"><span class="brand-mark">UM</span><div><strong>UML Maker</strong><small id="file-status">無題 · 未保存</small></div></div>
      <button id="new-button" title="新規作成 (Ctrl+N)">＋ 新規ドキュメント</button>
      <button id="save-button" class="primary" title="保存 (Ctrl+S)">保存</button>
    </div>
    <div class="toolbar">
      <button id="add-element">＋ <span>要素</span></button>
      <button id="add-note">＋ メモ</button>
      <button id="delete-button" class="danger" disabled>削除</button>
    </div>
  </header>
  <main>
    <aside class="left-panel">
      <div class="panel-heading"><span>ドキュメント</span><span id="diagram-badge" class="badge"></span></div>
      <label class="field"><span>タイトル</span><input id="document-title"></label>
      <label class="field"><span>概要（AI向け）</span><textarea id="document-description" rows="4" placeholder="この設計の目的や前提"></textarea></label>
    </aside>
    <section id="workspace" class="workspace">
      <div class="canvas-rulers"><span id="zoom-label">100%</span></div>
      <div id="canvas" class="canvas">
        <svg id="edges" aria-label="関係線"><defs>
          <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#92a4c8"/></marker>
          <marker id="triangle" markerWidth="13" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L12,6 L1,11 z" fill="#151b26" stroke="#92a4c8" stroke-width="1.5"/></marker>
          <marker id="diamond" markerWidth="15" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,6 L7,1 L14,6 L7,11 z" fill="#151b26" stroke="#92a4c8" stroke-width="1.5"/></marker>
          <marker id="diamond-filled" markerWidth="15" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,6 L7,1 L14,6 L7,11 z" fill="#92a4c8" stroke="#92a4c8"/></marker>
        </defs></svg>
      </div>
    </section>
    <aside class="right-panel">
      <div class="panel-heading objects-heading"><span>要素一覧</span><span id="element-count">0</span></div>
      <div id="element-list" class="element-list"></div>
      <div class="panel-heading properties-heading">プロパティ</div>
      <div id="inspector-empty" class="inspector-empty">要素、矢印、メモを選択すると<br>ここで詳細を編集できます。</div>
      <div id="inspector"></div>
    </aside>
  </main>

  <dialog id="new-dialog">
    <form method="dialog">
      <div class="dialog-title"><small>NEW DOCUMENT</small><h2>作成する図を選択</h2><p>保存操作をするまでファイルは作成されません。</p></div>
      <div id="type-options" class="type-options"></div>
      <div class="dialog-actions"><button value="cancel">キャンセル</button><button id="create-document" value="default" class="primary">作成</button></div>
    </form>
  </dialog>
  <dialog id="ai-export-dialog" class="ai-export-dialog">
    <form method="dialog">
      <div class="dialog-title"><small>AI INSTRUCTION JSON</small><h2>AI指示用JSON</h2><p>内部IDや座標を除き、チャットで理解しやすい日本語の構造に変換しています。</p></div>
      <textarea id="ai-export-text" readonly spellcheck="false" aria-label="AI指示用JSON全文"></textarea>
      <div class="ai-export-summary" id="ai-export-summary"></div>
      <div class="dialog-actions"><button value="cancel">閉じる</button><button id="copy-ai-json" type="button" class="primary">全文をコピー</button></div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
